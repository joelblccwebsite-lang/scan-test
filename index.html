<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="robots" content="noindex,nofollow">
<title>報到領餐｜連續掃描</title>
<!--
  ╔══════════════════════════════════════════════════════════════╗
  ║ 盧安格特會｜外部連續掃描頁 v7.5.4                              ║
  ║ 放在 GitHub Pages，只有程式，不含任何名單。                      ║
  ║ 名單是登入後才從 Apps Script 下載，存在手機瀏覽器裡，登出就清掉。  ║
  ║ 同一層資料夾要放 html5-qrcode.min.js（舊 iPhone 的備援辨識）。    ║
  ║ v7.2：淺色底＋深色字｜所有字放大（最小 15px）｜結果與剩餘份數超大   ║
  ║ v7.3：安全性補強                                                ║
  ║   ・登入後手機只存「登入憑證」，不再存密碼（16 小時自動失效）       ║
  ║   ・憑證過期、密碼更換時自動登出（沒送出的紀錄會保留）             ║
  ║   ・登出時連同名單一起清乾淨                                     ║
  ║   ・名牌 QR 只含 5 位數代碼（相機直接掃不會開網頁，要用本頁掃）     ║
  ║ v7.4：A3 活動日警示                                             ║
  ║   ・活動日（12/7～12/9）當天如果還是「手動指定」模式，            ║
  ║     狀態條會出現紅底大字警告，提醒去控制台改回「自動判斷」         ║
  ║   ・非活動日（演練）不會跳警告，不會吵                            ║
  ║ v7.5：報到模式常駐餐點卡片（要搭配 .gs 的 dm 欄位）                ║
  ║ v7.5.1：等待掃描只留白字、不要背景；掃描框改成置中的大方黃框        ║
  ║   （框的位置＝實際讀取範圍，layout／cropOf／startLib 三處一致）    ║
  ╚══════════════════════════════════════════════════════════════╝
-->
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#F4F6F8;color:#111;overscroll-behavior:none}
body{font:18px/1.45 system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
     padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input,select{font-family:inherit}
.hide{display:none!important}

/* ---------- 共用卡片（設定、登入） ---------- */
.card{max-width:480px;margin:0 auto;padding:20px 16px}
.card h1{font-size:26px;margin:6px 0 6px;color:#111}
.card p{font-size:17px;color:#333;margin:6px 0 14px}
.card label{display:block;font-size:17px;font-weight:700;color:#222;margin:14px 0 6px}
.card input,.card select{width:100%;font-size:21px;padding:14px;border:2px solid #7A8494;border-radius:10px;
     background:#fff;color:#111}
.btn{display:block;width:100%;margin-top:14px;padding:17px;border:none;border-radius:10px;
     background:#1456B8;color:#fff;font-size:21px;font-weight:800}
.btn.sec{background:#fff;color:#111;border:2px solid #7A8494;font-weight:700}
.err{color:#B3261E;font-size:17px;font-weight:700;min-height:22px;margin-top:8px}

/* ---------- 狀態條（淺底深字，數字超大） ---------- */
#bar{position:fixed;top:0;left:0;right:0;z-index:30;background:#fff;border-bottom:3px solid #C5CCD6;
     padding:calc(6px + env(safe-area-inset-top)) 12px 6px}
#bigT{font-size:22px;font-weight:800;color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
#b1{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-top:2px}
#bigN{font-size:76px;font-weight:900;line-height:1;letter-spacing:-1px;color:#0A5C2E}
#bigN.low{color:#C62828}
#bigL,.st2 .l{font-size:19px;font-weight:700;color:#333;margin-top:2px;white-space:nowrap}
#s2{display:flex;gap:16px;align-items:flex-end}
.st2 .n{font-size:40px;font-weight:900;line-height:1;color:#111}
.st2 .n small{font-size:19px;color:#444;font-weight:800;margin-left:1px}
#b2{display:flex;flex-wrap:wrap;gap:2px 14px;margin-top:6px;font-size:17px;color:#333}
#b2 b{color:#111;font-weight:900;font-size:19px}
#b3{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;margin-top:5px;font-size:15px;color:#333}
#dot{width:12px;height:12px;border-radius:50%;background:#1E9E55;flex:none}
#dot.busy{background:#E0A100}
#dot.bad{background:#D62B1B}
#q.warn{color:#A04800;font-weight:900;font-size:17px}
/* v7.4：活動日卻是手動模式 → 紅底大字警示（非活動日不顯示） */
#mWarn{background:#C62828;color:#fff;border-radius:9px;padding:7px 10px;margin-top:6px;
     font-size:19px;font-weight:900;line-height:1.3;text-align:center}
#mWarn small{display:block;font-size:15px;font-weight:700;margin-top:2px;color:#FFE8E5}

/* ---------- 鏡頭（常駐，結果只蓋上方一塊） ---------- */
#camWrap{position:fixed;top:0;left:0;right:0;bottom:0;background:#000;z-index:10}
#vid{width:100%;height:100%;object-fit:cover;display:block}
#reader{width:100%;height:100%}
#reader video{width:100%!important;height:100%!important;object-fit:cover!important}
#box{position:fixed;z-index:12;border:5px solid #FFE600;outline:2px solid rgba(0,0,0,.55);border-radius:4px;pointer-events:none}

/* ---------- 工具列 ---------- */
#tools{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:3px solid #C5CCD6;
     padding:6px 6px calc(6px + env(safe-area-inset-bottom));display:flex;gap:5px}
#tools button{flex:1;min-height:60px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid #7A8494;border-radius:10px;background:#fff;
     color:#111;font-size:17px;font-weight:800;line-height:1.2}
#tools button i{display:block;font-style:normal;font-size:22px;line-height:1.15}
#tools button.on{background:#FFE600;color:#111;border-color:#B89B00}
#tools button.warn{background:#C62828;color:#fff;border-color:#8E1B1B}

/* ---------- 結果（只佔上方一塊；平常是灰色「等待掃描」）
   淺色底＋粗色框＋深色大字；標題前面還有 ✔ ⚠ ✖ 符號，不只靠顏色分辨 ---------- */
#res{position:fixed;z-index:25;left:0;right:0;display:flex;flex-direction:column;
     align-items:center;justify-content:flex-start;text-align:center;padding:8px 12px;overflow:auto;
     border:8px solid transparent;color:#111}
#res.idle{background:#F2F4F7;border-color:#C5CCD6}
#res.ok{background:#DDF7E5;border-color:#0E9A4B}
#res.warn{background:#FFF3C4;border-color:#F0A800}
#res.err{background:#FFE1DD;border-color:#D62B1B}
#res.info{background:#E3EDFA;border-color:#2F6FB8}
#res>:first-child{margin-top:auto}
#res>:last-child{margin-bottom:auto}
#resT{font-size:clamp(34px,10vw,50px);font-weight:900;letter-spacing:1px;line-height:1.15}
#resT.long{font-size:clamp(26px,7.4vw,40px);letter-spacing:0}
#res.ok #resT{color:#04612A}
#res.warn #resT{color:#7A4A00}
#res.err #resT{color:#A31300}
#res.info #resT{color:#123E7A}
#res.idle #resT{color:#3A4453;font-size:clamp(28px,8vw,38px)}
#resN{font-size:clamp(26px,7.5vw,36px);font-weight:900;margin-top:4px;color:#111;line-height:1.2}
#resM{font-size:19px;font-weight:600;margin-top:4px;color:#1A1A1A;line-height:1.35}
#res.idle #resM{color:#4A5565;font-weight:500}
#resX{font-size:15px;margin-top:5px;color:#444}

/* ---------- 浮層（手動輸入、警示） ---------- */
#ov{position:fixed;top:0;left:0;right:0;bottom:0;z-index:40;background:#F4F6F8;overflow-y:auto;padding:16px}
#ov .ib{max-width:480px;margin:0 auto}
#ovT{font-size:24px;font-weight:900;margin-bottom:12px;color:#111}
.row{display:flex;gap:8px;align-items:center;padding:13px 12px;border:2px solid #B8C0CC;border-radius:10px;
     background:#fff;margin-bottom:8px;font-size:19px;color:#111}
.row .g{margin-left:auto;font-size:15px;color:#333;text-align:right}
#alert{background:#FFE1DD;border:3px solid #D62B1B;border-radius:12px;padding:14px;margin-bottom:10px;color:#111}
#alert h3{margin:0 0 8px;font-size:22px;color:#A31300}
#alert div{font-size:19px;margin-top:5px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:45;background:#1F2937;
     color:#fff;font-size:17px;font-weight:700;padding:11px 16px;border-radius:20px;max-width:90%;text-align:center}
/* v7.5：報到模式常駐餐點卡片 */
#mCard{display:flex;align-items:center;gap:10px;margin-top:6px;border:2px solid #C5CCD6;border-radius:12px;padding:6px 10px;background:#fff}
#mcL{text-align:center;padding-right:10px;border-right:2px solid #E1E5EB;min-width:84px}
#mcN{font-size:52px;font-weight:900;line-height:1;color:#0A5C2E}
#mcN.low{color:#C62828}
#mcLb{font-size:14px;color:#444;margin-top:2px;white-space:nowrap}
#mcR{flex:1;min-width:0}
#mcT{font-size:17px;font-weight:800;color:#111;line-height:1.3}
#mcT small{font-size:14px;font-weight:600;color:#444;margin-left:5px}
.mcRow{display:flex;justify-content:space-between;font-size:15px;line-height:1.35;color:#222}
.mcRow b{font-size:16px;font-weight:900;color:#111}
/* v7.5：等待掃描時不要背景和框，只留字（白字加深色描邊，疊在鏡頭畫面上也看得清楚） */
#res.idle{background:transparent;border-color:transparent}
#res.idle #resT{color:#FFE600;text-shadow:0 0 4px #000,0 2px 6px #000,0 0 10px #000}
#res.idle #resM{color:#fff;text-shadow:0 0 4px #000,0 2px 6px #000,0 0 10px #000}
/* v7.5.3：掃描結果改成「狀態條右上角小卡」，不再蓋住鏡頭；鏡頭區只留黃字「等待掃描」 */
#bar{position:fixed}
#res{position:absolute;z-index:31;left:44%;right:6px;top:0;
     width:auto;height:auto;padding:4px 8px;border-width:4px;border-style:solid;border-radius:12px;
     overflow:hidden;justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,.25)}
#res>:first-child,#res>:last-child{margin:0}
#res #resT{font-size:19px;letter-spacing:0;line-height:1.2;word-break:break-all}
#res #resT.long{font-size:17px}
#res #resN{font-size:26px;margin-top:2px;line-height:1.15;word-break:break-all}
#res #resM{font-size:15px;margin-top:2px;line-height:1.3;font-weight:700;word-break:break-all}
#res #resX{font-size:12px;margin-top:2px;color:#555}
#wait{position:fixed;z-index:25;left:0;right:0;text-align:center;pointer-events:none;
     font-size:22px;line-height:26px;font-weight:900;color:#FFE600;letter-spacing:1px;
     text-shadow:0 0 4px #000,0 2px 6px #000,0 0 10px #000}
</style>
</head>
<body>

<!-- ===================== 1. 第一次設定端點 ===================== -->
<div id="setup" class="card hide">
  <h1>⚙️ 第一次設定</h1>
  <p>請貼上 Apps Script 網頁應用程式網址（結尾是 <b>/exec</b>）。設定一次就會記住。</p>
  <label>Apps Script 網址</label>
  <input id="sEp" type="url" inputmode="url" placeholder="https://script.google.com/macros/s/AKfy…/exec" autocomplete="off">
  <button class="btn" id="sGo">儲存並繼續</button>
  <div class="err" id="sErr"></div>
</div>

<!-- ===================== 2. 登入 ===================== -->
<div id="login" class="card hide">
  <h1>📷 報到領餐連續掃描</h1>
  <p id="lgSub">登入後會下載名單到這支手機，之後掃描不用等伺服器，斷網也能照掃。</p>
  <label>這支手機的名字（寫在紀錄裡，方便事後對帳）</label>
  <select id="lgDev">
    <option>手機 A</option><option>手機 B</option><option>手機 C</option>
    <option>手機 D</option><option>手機 E</option><option>手機 F</option>
    <option>服務台</option>
  </select>
  <label>工作人員密碼</label>
  <input id="lgKey" type="password" inputmode="numeric" placeholder="密碼" autocomplete="current-password">
  <button class="btn" id="lgGo">登入並下載名單</button>
  <button class="btn sec" id="lgPing">只測連線（不用密碼）</button>
  <div class="err" id="lgErr"></div>
  <p style="margin-top:16px;font-size:15px;color:#444">v<span class="ver"></span>｜請用 Chrome（Android）或 Safari／Chrome（iPhone）開啟；若顯示「無法要求權限」，請先關掉手機上浮在畫面的 App（濾藍光、錄影、小白點、泡泡）。</p>
</div>

<!-- ===================== 3. 主畫面 ===================== -->
<div id="main" class="hide">
  <div id="bar">
    <div id="bigT">—</div>
    <div id="b1">
      <div><div id="bigN">—</div><div id="bigL">剩餘份數</div></div>
      <div id="s2"></div>
    </div>
    <div id="b2"></div>
    <div id="mCard" class="hide"><div id="mcL"><div id="mcN">—</div><div id="mcLb">剩餘份數</div></div><div id="mcR"></div></div>
    <div id="mWarn" class="hide"></div>
    <div id="b3">
      <span id="dot"></span><span id="sTxt">準備中</span>
      <span id="q">未同步 0 筆</span>
      <span style="margin-left:auto">v<span class="ver"></span>｜<span id="devN"></span></span>
    </div>
    <div id="res" class="hide"></div>
  </div>

  <div id="camWrap">
    <video id="vid" playsinline muted autoplay class="hide"></video>
    <div id="reader" class="hide"></div>
  </div>
  <div id="box" class="hide"></div>

  <div id="wait">等待掃描</div>

  <div id="tools">
    <button id="tTorch"><i>🔅</i>手電筒</button>
    <button id="tManual"><i>⌨️</i>手動</button>
    <button id="tExtra" class="hide"><i>➕</i>加發</button>
    <button id="tUndo"><i>↩️</i>取消<br>上一筆</button>
    <button id="tMore"><i>⋯</i>其他</button>
  </div>
</div>

<!-- ===================== 4. 浮層 ===================== -->
<div id="ov" class="hide"><div class="ib">
  <div id="ovT"></div>
  <div id="ovBody"></div>
  <button class="btn sec" id="ovClose">關閉</button>
</div></div>

<script src="html5-qrcode.min.js" onerror="window.__LIBFAIL=1"></script>
<script>
/* ============================================================
   設定
   ============================================================ */
var VER = '7.5.4';
/* 想把網址寫死在程式裡就填這一行（留白＝第一次用時手動輸入，之後記住） */
var EXEC_URL = 'https://script.google.com/macros/s/AKfycbw9OvDJkq71uuowEmXVhT8-y5Tw9yAgCQf_JxZI7N3FpRtierb2GtIM1X92bpZXK3AIyg/exec';
var SYNC_MS   = 2500;   // 幾毫秒送一次
var SYNC_N    = 3;      // 累積幾筆就立刻送
var IDLE_MS   = 20000;  // 閒著時幾毫秒更新一次數字
var DUP_MS    = 2000;   // 同一個碼幾毫秒內重複掃到就忽略
var OK_MS     = 1500;   // 綠燈結果幾毫秒後自動消失
var SCAN_MS   = 120;    // 掃描間隔（Android 內建辨識）
var FETCH_MS  = 12000;  // 單次連線逾時
var RES_FRAC  = 0.44;   // 結果區佔「狀態條到工具列之間」的比例（其餘是鏡頭）。v7.2：字變大，所以從 0.34 加到 0.44
var LIB_FPS   = 15;     // iPhone（函式庫辨識）每秒嘗試次數
var LIB_RES   = [640, 480];  // iPhone 鏡頭解析度（越小越快；若變得很難對焦或掃不到，改回 [1280, 720]）
var LOGIN_H   = 16;     // v7.3：登入憑證有效小時數（要跟程式碼.gs 的 CONFIG.LOGIN_HOURS 一樣；伺服器才是最後把關）

/* ============================================================
   小工具
   ============================================================ */
function $(id){ return document.getElementById(id); }
function show(el,on){ el.classList[on?'remove':'add']('hide'); }
function txt(el,s){ el.textContent = (s==null?'':String(s)); }
function LS(k,v){
  try{
    if(v===undefined) return localStorage.getItem('v7_'+k);
    if(v===null) localStorage.removeItem('v7_'+k); else localStorage.setItem('v7_'+k,v);
  }catch(e){}
  return null;
}
function num(n){ return (n==null||isNaN(n))?'—':String(n); }
Array.prototype.slice.call(document.querySelectorAll('.ver')).forEach(function(e){ e.textContent = VER; });

/* 從 QR 內容取出 5 位數代碼（v7.3 起名牌 QR 裡就是代碼本身；舊版名牌是網址 …/exec?code=12345，也認得） */
function codeOf(s){
  s = String(s||'').trim();
  var m = s.match(/[?&](?:code|c)=([A-Za-z0-9]+)/);
  return (m?m[1]:s).toUpperCase().replace(/[^A-Z0-9]/g,'');
}

/* ============================================================
   狀態
   ============================================================ */
var EP='', KEY='', DEV='手機 A', DID='';
var ROSTER={}, OLDMAP={}, META=null;      // META：days / meals / grace / fallback
var CTX=null, STATS={day:null,meal:null};
var QUEUE=[], SEQ=0, SKEW=0, SN=0;
var LAST=null;                            // 上一筆成功的動作（給「取消上一筆」用）
var lastCode='', lastAt=0, syncing=false, resTimer=null, started=false, LOGGINGOUT=false;
var WARN=[];                              // 伺服器事後否決的警示
var L={T:0,H:0,W:0,resH:0,vh2:0,side:0};  // 版面尺寸（layout 算出來）

/* ============================================================
   連線
   ============================================================ */
function api(action, extra){
  var body = Object.assign({ a:action, k:KEY, dev:DEV, ver:VER }, extra||{});
  var ctl = (window.AbortController? new AbortController(): null);
  var to = setTimeout(function(){ try{ ctl&&ctl.abort(); }catch(e){} }, FETCH_MS);
  return fetch(EP, {
    method:'POST',
    headers:{ 'Content-Type':'text/plain;charset=utf-8' },   // ★ 不能用 application/json
    body: JSON.stringify(body),
    redirect:'follow',
    signal: ctl?ctl.signal:undefined
  }).then(function(r){ return r.text(); }).then(function(t){
    clearTimeout(to);
    var o;
    try{ o = JSON.parse(t); }
    catch(e){ throw new Error('伺服器回傳不是 JSON（可能部署沒設「所有人」可存取）'); }
    if(o && o.now) SKEW = o.now - Date.now();
    if(o && o.minVer && cmpVer(VER, o.minVer) < 0) tooOld();
    return o;
  }, function(e){ clearTimeout(to); throw e; });
}
function cmpVer(a,b){
  var x=String(a).split('.').map(Number), y=String(b).split('.').map(Number);
  for(var i=0;i<3;i++){ if((x[i]||0)!==(y[i]||0)) return (x[i]||0)-(y[i]||0); }
  return 0;
}
function tooOld(){
  overlay('⚠️ 這個掃描頁太舊了', '<div class="row">伺服器要求的版本比較新。請把這一頁「重新整理」（下拉或按重新載入）。未送出的紀錄已存在手機裡，重新整理不會不見。</div>');
}
function now(){ return Date.now() + SKEW; }

/* ============================================================
   登入憑證（v7.3）
   登入成功後，伺服器給一張 16 小時有效的憑證；手機存憑證、不存密碼。
   憑證過期、或工作人員密碼被更換，都會自動回到登入畫面（沒送出的紀錄會保留）。
   ============================================================ */
function expAt(){ return Number(LS('exp')||0); }
function expired(){ var e = expAt(); return e>0 && now()>e; }
function enforceExpiry(){
  if(!started || !expired()) return;
  if(QUEUE.length){ sync(); return; }          // 還有沒送出的：先送；送不出去（憑證已失效）會自動登出並保留紀錄
  logout(true, '登入已超過 '+LOGIN_H+' 小時，為了安全請重新登入');
}

/* ============================================================
   名單
   ============================================================ */
var rsT=null;
function rosterSaveNow(){
  rsT=null;
  if(LOGGINGOUT) return;       // v7.3：登出中不要再把名單寫回手機
  try{
    LS('roster', JSON.stringify({ r:ROSTER, o:OLDMAP, m:META, v:(META&&META.rosterVer)||0 }));
  }catch(e){ toast('名單存不進手機（空間不足），斷網時會無法判斷'); }
}
/* 連續掃描時每一筆都寫 20 多 KB 會卡，所以延後 2 秒合併寫一次。
   真正的紀錄（排隊）是每一筆立刻存的，所以當機也不會掉資料。 */
function rosterSave(){ if(!rsT) rsT = setTimeout(rosterSaveNow, 2000); }
window.addEventListener('pagehide', rosterSaveNow);
window.addEventListener('beforeunload', rosterSaveNow);
function rosterLoad(){
  try{
    var s = LS('roster'); if(!s) return false;
    var o = JSON.parse(s);
    if(!o||!o.r||!o.m) return false;
    ROSTER=o.r; OLDMAP=o.o||{}; META=o.m;
    return true;
  }catch(e){ return false; }
}
function rosterApply(d){
  ROSTER={}; OLDMAP=d.old||{};
  (d.list||[]).forEach(function(x){
    ROSTER[x[0]] = { n:x[1], ch:x[2], o:x[3], i:x[4], g:x[5], z:x[6] };
  });
  META = { days:d.days, meals:d.meals, grace:d.grace, fallback:d.fallback,
           rosterVer:d.rosterVer, badge:d.badge, event:d.event };
  SEQ = d.seq||0; LS('seq', String(SEQ));
  CTX = d.ctx; STATS = d.stats||{day:null,meal:null};
  pendRoster(); pendStats();          // v7.1：還沒送出的筆數要再套回去
  rosterSaveNow();
}
function download(cb){
  api('roster', {}).then(function(d){
    if(!d.ok){
      if(d.err==='auth' && started){ logout(true, '登入已過期或密碼已更換，請重新輸入密碼'); return; }
      cb(d.msg||'下載名單失敗'); return;
    }
    /* v7.3：伺服器給了憑證 → 之後都用憑證，密碼不留在手機上 */
    if(d.tok){
      KEY = d.tok; LS('key', d.tok);
      LS('exp', String(d.exp || (Date.now() + (d.loginHours||LOGIN_H)*3600000)));
    }
    rosterApply(d); cb(null, d);
  }, function(e){ cb('連不上伺服器：'+(e.message||e)); });
}

/* ============================================================
   現在是什麼模式（伺服器說了算；自動判斷時本機也會自己算時段）
   ============================================================ */
function mode(){
  if(!CTX) return { m:'none' };
  if(CTX.modeVal){                                   // 控制台手動指定
    return CTX.mealId ? { m:'meal', meal:CTX.mealId, day:'' } : { m:'in', day:CTX.dayId };
  }
  if(!META||!META.days) return { m:CTX.mode, day:CTX.dayId, meal:CTX.mealId };
  var d = new Date(now());
  var y = d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
  var day = META.days.filter(function(x){ return x.date===y; })[0];
  if(!day) return { m:'none' };
  var mins = d.getHours()*60 + d.getMinutes(), g = Number(META.grace||0), meal=null;
  META.meals.forEach(function(m){
    if(m.day!==day.id) return;
    if(mins >= hm(m.from)-g && mins <= hm(m.to)+g) meal = m;
  });
  return meal ? { m:'meal', meal:meal.id, day:day.id } : { m:'in', day:day.id };
}
function p2(n){ return n<10?('0'+n):String(n); }
function hm(s){ var a=String(s||'').split(':'); return Number(a[0]||0)*60+Number(a[1]||0); }
function dayIdx(id){ return (META&&META.days||[]).findIndex(function(x){ return x.id===id; }); }
function mealIdx(id){ return (META&&META.meals||[]).findIndex(function(x){ return x.id===id; }); }
function mealOf(id){ return (META&&META.meals||[]).filter(function(x){ return x.id===id; })[0]||null; }
function dayOf(id){ return (META&&META.days||[]).filter(function(x){ return x.id===id; })[0]||null; }
/* v7.4：今天是不是活動日（用伺服器對過時的時間算） */
function isEventDay(){
  if(!META || !META.days) return false;
  var d = new Date(now());
  var y = d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
  for(var i=0;i<META.days.length;i++){ if(META.days[i].date===y) return true; }
  return false;
}

/* ============================================================
   掃到一個碼 → 本機立刻判斷（A1：不等伺服器）
   ============================================================ */
function hit(raw){
  var code = codeOf(raw);
  if(!code) return;
  var t = Date.now();
  if(code===lastCode && (t-lastAt)<DUP_MS) return;    // A5：同碼 2 秒內略過
  lastCode = code; lastAt = t;

  if(OLDMAP[code]){
    var np = ROSTER[OLDMAP[code]];
    return paint('err','請收回這張舊名牌', np?np.n:'', '這張已經作廢，請他到服務台換新的', true);
  }
  var p = ROSTER[code];
  if(!p) return paint('err','請他到服務台','','查不到這張名牌（'+code+'）', true);

  var mo = mode();
  var zz = p.z ? '（⚠️ 不在最新名單，請確認）' : '';

  if(mo.m==='none')
    return paint('info','今天不記錄', p.n, '今天不是活動日。要演練請用控制台「掃描模式」手動指定', true);

  if(mo.m==='in'){
    var di = dayIdx(mo.day), db = 1<<di, dl = (dayOf(mo.day)||{}).label||'';
    if(di<0) return paint('err','設定有問題','','找不到日期，請重新整理這一頁', true);
    if(p.i & db) return paint('warn','今天已經報到過', p.n, dl+' 已報到，不用再做'+zz, true);
    p.i |= db; rosterSave();
    queue({ t:'in', c:code, i:mo.day }, 'ok'); bumpDay();
    var td = (META.meals||[]).filter(function(m,j){ return m.day===mo.day && (p.o & (1<<j)); }).map(function(m){ return m.name; });
    return paint('ok','可以進場', p.n, '報到完成｜今天有訂：'+(td.length?td.join('、'):'無')+zz, false);
  }

  /* 領餐 */
  var mi = mealIdx(mo.meal), mb = 1<<mi, m = mealOf(mo.meal);
  if(mi<0||!m) return paint('err','設定有問題','','找不到餐次，請重新整理這一頁', true);
  var di2 = dayIdx(m.day), db2 = 1<<di2;
  var autoIn = (di2>-1 && !(p.i & db2));

  if(!(p.o & mb)){
    if(autoIn){ p.i |= db2; rosterSave(); queue({ t:'in', c:code, i:m.day }, 'warn'); bumpDay(); }
    return paint('err','請他到服務台', p.n, '沒有訂「'+m.name+'」，服務台可以現場加發'+(autoIn?'｜已順便幫他報到':''), true);
  }
  if(p.g & mb)
    return paint('warn','已經領過，不要再發', p.n, '這一餐（'+m.name+'）已經領走了', true);

  p.g |= mb; if(autoIn) p.i |= db2; rosterSave();
  queue({ t:'meal', c:code, i:m.id, ai:(autoIn?1:0) }, 'ok');
  bumpLocal(-1, autoIn);
  if(autoIn) bumpDay();
  return paint('ok','可以發餐', p.n, m.name+'（'+m.food+'）'+(autoIn?'｜已順便幫他報到':'')+zz, false);
}

/* ============================================================
   排隊與同步（A2）
   ============================================================ */
function queue(ev, verdict){
  SN++; LS('sn', String(SN));
  ev.u = DID+'-'+now().toString(36)+'-'+SN;
  ev.ts = now();
  ev.lv = verdict||'ok';
  QUEUE.push(ev);
  qSave();
  LAST = ev;
  if(QUEUE.length >= SYNC_N) sync();
  paintBar();
}
function qSave(){ try{ LS('queue', JSON.stringify(QUEUE)); }catch(e){} }
function qLoad(){
  try{ var s=LS('queue'); QUEUE = s?JSON.parse(s):[]; if(!Array.isArray(QUEUE)) QUEUE=[]; }catch(e){ QUEUE=[]; }
  SEQ = Number(LS('seq')||0); SN = Number(LS('sn')||0);
}

/* v7.1｜修「數字倒退跳動」：
   伺服器回來的統計只包含「它已經記好的」，手機裡還沒送出的筆數要再加回去，畫面才不會往回跳。 */
function pendStats(){
  var m = STATS && STATS.meal, d = STATS && STATS.day;
  QUEUE.forEach(function(e){
    if(e.t==='meal'){
      if(m && typeof m.left==='number'){ m.left--; m.got++; if(!e.ai && m.waiting>0) m.waiting--; }
      if(e.ai && d && typeof d.checked==='number') d.checked++;
    } else if(e.t==='in'){
      if(d && typeof d.checked==='number') d.checked++;
    } else if(e.t==='extra'){
      if(m && typeof m.left==='number'){ m.extra++; m.left--; }
    } else if(e.t==='undo'){
      if(e.ut==='meal' && m && typeof m.left==='number'){ m.left++; m.got--; }
      else if(e.ut==='in' && d && typeof d.checked==='number'){ d.checked--; }
      else if(e.ut==='extra' && m && typeof m.left==='number'){ m.extra--; m.left++; }
    }
  });
}
/* 重新下載名單時，還沒送出的「已領／已報到」也要記回名單，不然會被當成沒領過 */
function pendRoster(){
  QUEUE.forEach(function(e){
    var p = ROSTER[e.c]; if(!p) return;
    if(e.t==='meal'){ var mi=mealIdx(e.i); if(mi>-1) p.g |= (1<<mi); if(e.ai){ var mm=mealOf(e.i); var d1=mm?dayIdx(mm.day):-1; if(d1>-1) p.i |= (1<<d1); } }
    else if(e.t==='in'){ var di=dayIdx(e.i); if(di>-1) p.i |= (1<<di); }
    else if(e.t==='undo' && e.ut==='meal'){ var m2=mealIdx(e.i); if(m2>-1) p.g &= ~(1<<m2); }
    else if(e.t==='undo' && e.ut==='in'){ var d2=dayIdx(e.i); if(d2>-1) p.i &= ~(1<<d2); }
  });
}
/* 送給伺服器的資料不帶本機專用欄位（ai） */
function wire(e){ var o={}; for(var k in e){ if(k!=='ai') o[k]=e[k]; } return o; }

function sync(){
  if(syncing || !KEY || !EP) return;
  syncing = true; dot('busy','同步中');
  var sending = QUEUE.slice(0, 40);
  api('sync', { seq:SEQ, ev:sending.map(wire) }).then(function(d){
    syncing = false;
    if(d.err==='auth'){ dot('bad','需要重新登入'); return logout(true, '登入已過期或密碼已更換，請重新輸入密碼（沒送出的紀錄還在，登入後會自動補送）'); }
    if(!d || (!d.ok && !d.busy)){ dot('bad', d&&d.msg?('伺服器：'+d.msg):'同步失敗'); return; }

    /* busy＝伺服器剛好被別台鎖住，整批留著下次重送 */
    if(!d.busy){
      var done = {};
      (d.res||[]).forEach(function(x){ if(x.u) done[x.u]=x; });
      QUEUE = QUEUE.filter(function(e){ return !done[e.u]; });
      qSave();
      checkRes(sending, done);
    }

    if(d.seq) SEQ = d.seq, LS('seq', String(SEQ));
    if(d.chg) applyChg(d.chg);
    if(d.ctx) CTX = d.ctx;
    if(d.stats){ STATS = d.stats; pendStats(); }   // v7.1：把還沒送出的筆數加回去
    if(d.resync || (d.rosterVer && META && d.rosterVer !== META.rosterVer)) refresh(d.resync);
    dot(QUEUE.length?'busy':'ok', QUEUE.length?('還有 '+QUEUE.length+' 筆要送'):'已同步');
    paintBar();
  }, function(e){
    syncing = false;
    dot('bad', (e&&e.name==='AbortError')?'網路慢，稍後自動重送':'沒有網路，稍後自動重送');
    paintBar();
  });
}

/* 伺服器和本機判斷不一致 → 一定要讓同工看到（多機同時掃的保護） */
function checkRes(sent, done){
  var bad = [];
  sent.forEach(function(e){
    var r = done[e.u]; if(!r) return;
    if(e.lv==='ok' && !r.ok && r.kind!=='busy'){
      var p = ROSTER[e.c];
      if(r.kind==='got-dup' && p && e.t==='meal'){ var mi=mealIdx(e.i); if(mi>-1) p.g |= (1<<mi); bumpLocal(1); }
      if(r.kind==='in-dup' && p && e.t==='in'){ var di=dayIdx(e.i); if(di>-1) p.i |= (1<<di); }
      bad.push({ name:(r.name||(p?p.n:'')||e.c), code:e.c, kind:r.kind, msg:r.msg||'' });
    }
  });
  if(bad.length){ rosterSave(); WARN = WARN.concat(bad); showWarn(); }
}
function showWarn(){
  if(!WARN.length) return;
  var h = '<div id="alert"><h3>⚠️ 剛剛這幾筆伺服器不同意，請處理</h3>' +
    WARN.map(function(w){
      var k = w.kind==='got-dup' ? '別台已經發過了，請把餐收回' :
              w.kind==='in-dup'  ? '別台已經幫他報到過' :
              w.kind==='none'    ? '伺服器查不到這張名牌' :
              w.kind==='hist'    ? '這張名牌已作廢，請收回' :
              w.kind==='no-order'? '其實沒有訂這一餐' :
              w.kind==='stale'   ? '名單剛變動，請重新掃一次' : (w.msg||w.kind);
      return '<div>・<b>'+esc(w.name)+'</b>（'+esc(w.code)+'）：'+k+'</div>';
    }).join('') + '</div>';
  overlay('需要你處理', h, function(){ WARN = []; });
  beep('err'); buzz([200,80,200]);
}
function esc(s){ var d=document.createElement('div'); d.textContent=(s==null?'':s); return d.innerHTML; }

/* 把別台的變動套到本機名單（雙向同步） */
function applyChg(chg){
  var n = 0;
  chg.forEach(function(x){
    var p = ROSTER[x.c]; if(!p) return;
    if(x.t==='in'){ var di=dayIdx(x.i); if(di>-1 && !(p.i&(1<<di))){ p.i|=(1<<di); n++; } }
    else if(x.t==='meal'){ var mi=mealIdx(x.i); if(mi>-1 && !(p.g&(1<<mi))){ p.g|=(1<<mi); n++; } }
    else if(x.t==='undo-in'){ var d2=dayIdx(x.i); if(d2>-1){ p.i &= ~(1<<d2); n++; } }
    else if(x.t==='undo-meal'){ var m2=mealIdx(x.i); if(m2>-1){ p.g &= ~(1<<m2); n++; } }
  });
  if(n) rosterSave();
}
function refresh(hard){
  download(function(err){
    if(err) return toast('名單更新失敗：'+err);
    toast(hard?'名單已重新下載':'名單有更新，已重新下載');
    paintBar();
  });
}

/* ============================================================
   畫面
   ============================================================ */
function dot(k, s){
  var d=$('dot'); d.className = (k==='ok'?'':k);
  txt($('sTxt'), s||'');
  layout();   // v7.2：狀態文字變長可能換行，狀態條變高，要重新算版面
}
function bumpLocal(d, autoIn){   // 掃到就先把剩餘份數加減，不用等伺服器
  if(STATS && STATS.meal && typeof STATS.meal.left==='number'){
    STATS.meal.left += d;
    STATS.meal.got  -= d;
    /* 本來就報到過的人才算在「報到未領」裡；順便補報到的不算 */
    if(!autoIn && STATS.meal.waiting>0 && d<0) STATS.meal.waiting -= 1;
  }
  paintBar();
}
function bumpDay(){   // 本機先把報到人數加 1，不用等伺服器
  if(STATS && STATS.day && typeof STATS.day.checked==='number'){ STATS.day.checked++; paintBar(); }
}
/* v7.4：活動日 ＋ 手動指定模式 → 紅底大字警示（非活動日演練時不會跳） */
function paintWarn(){
  var w = $('mWarn');
  if(!w) return;
  if(isEventDay() && CTX && CTX.modeVal){
    w.innerHTML = '🔧 現在是「手動指定｜'+esc(CTX.manualMode||'')+'」' +
                  '<small>今天是活動日，不是自動判斷！請到控制台改回「🔄 自動判斷」再開始</small>';
    show(w, true);
  } else {
    show(w, false);
  }
}
/* v7.5：報到模式常駐顯示當天餐點。報名、已領、報到未領由手機名單即時算；訂購、加發由伺服器給 */
var CARDM = '';
function pickMeal(day){
  var ms = (META && META.meals || []).filter(function(m){ return m.day===day; });
  if(!ms.length) return null;
  if(CARDM){ var f = ms.filter(function(m){ return m.id===CARDM; })[0]; if(f) return f; }
  var dd = dayOf(day), d = new Date(now());
  var y = d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
  if(dd && dd.date===y){
    var mins = d.getHours()*60+d.getMinutes(), g = Number(META.grace||0);
    for(var i=0;i<ms.length;i++){ if(mins <= hm(ms[i].to)+g) return ms[i]; }
    return ms[ms.length-1];
  }
  return ms[0];
}
function mealLive(m){
  var mb = 1<<mealIdx(m.id), db = 1<<dayIdx(m.day), reg=0, got=0, wait=0;
  for(var c in ROSTER){
    var p = ROSTER[c];
    if(!(p.o & mb)) continue;
    if(!p.z) reg++;
    if(p.g & mb) got++; else if(p.i & db) wait++;
  }
  return { reg:reg, got:got, wait:wait };
}
function mcRow(l, v){ return '<div class="mcRow"><span>'+l+'</span><b>'+num(v)+'</b></div>'; }
function paintCard(){
  var box = $('mCard'), mo = mode(), m = null, e = null;
  if(mo.m==='in' && META && STATS && STATS.dm){
    m = pickMeal(mo.day);
    if(m) e = STATS.dm.filter(function(x){ return x.id===m.id; })[0];
  }
  if(!m || !e){ show(box,false); return; }
  var s = mealLive(m), left = e.ordered - s.got - e.extra;
  var multi = (META.meals||[]).filter(function(x){ return x.day===mo.day; }).length > 1;
  txt($('mcN'), left);
  $('mcN').className = (left<=10)?'low':'';
  $('mcR').innerHTML = '<div id="mcT">'+esc(m.name)+'<small>'+esc(m.food)+'</small>'+(multi?'<small>｜點一下換餐</small>':'')+'</div>'+
    mcRow('報名份數', s.reg)+mcRow('訂購份數（含加訂）', e.ordered)+mcRow('已領（有訂餐）', s.got)+
    mcRow('現場加發', e.extra)+mcRow('已報到、還沒領', s.wait);
  show(box,true);
}
$('mCard').addEventListener('click', function(){
  var mo = mode(); if(mo.m!=='in') return;
  var ms = (META&&META.meals||[]).filter(function(x){ return x.day===mo.day; });
  if(ms.length<2) return;
  var cur = pickMeal(mo.day), i = ms.findIndex(function(x){ return cur && x.id===cur.id; });
  CARDM = ms[(i+1)%ms.length].id; paintBar();
});
function paintBar(){
  try{ paintCard(); }catch(e){ show($('mCard'),false); }
  var mo = mode();
  var q = QUEUE.length;
  var qe = $('q');
  txt(qe, '未同步 '+q+' 筆'+(q?'（別收工）':''));
  qe.className = q?'warn':'';
  txt($('devN'), DEV);

  if(mo.m==='meal' && STATS.meal){
    var s = STATS.meal;
    txt($('bigN'), num(s.left));
    $('bigN').className = (typeof s.left==='number' && s.left<=10)?'low':'';   // v7.2：剩 10 份以下變紅色
    txt($('bigL'), '剩餘份數');
    txt($('bigT'), s.name+'｜'+s.food);
    $('s2').innerHTML =
      '<div class="st2"><div class="n">'+num(s.got)+'</div><div class="l">已領</div></div>'+
      (STATS.day?('<div class="st2"><div class="n">'+num(STATS.day.checked)+'<small>/'+num(STATS.day.total)+'</small></div><div class="l">今日報到</div></div>'):'');
    $('b2').innerHTML =
      '<span>報名 <b>'+num(s.reg)+'</b></span>'+
      '<span>訂購 <b>'+num(s.ordered)+'</b></span>'+
      '<span>加發 <b>'+num(s.extra)+'</b></span>'+
      '<span>報到未領 <b>'+num(s.waiting)+'</b></span>';
    show($('tExtra'), true);
  } else if(mo.m==='in' && STATS.day){
    var d2 = STATS.day;
    txt($('bigN'), num(d2.checked));
    $('bigN').className = '';
    txt($('bigL'), '／'+num(d2.total)+' 已報到');
    txt($('bigT'), '報到｜'+d2.label);
    $('s2').innerHTML = '';
    $('b2').innerHTML = '<span>現在只記報到，不發餐</span>';
    show($('tExtra'), false);
  } else {
    txt($('bigN'), '—');
    $('bigN').className = '';
    txt($('bigL'), mo.m==='none'?'今天不記錄':'讀取中');
    txt($('bigT'), CTX&&CTX.manualMode?('🔧 '+CTX.manualMode):'');
    $('s2').innerHTML = '';

/* 結果：只蓋上方一塊，鏡頭永遠看得到。綠色 1.5 秒回到「等待掃描」；
   黃／紅會一直留著，直到掃下一位（自動換掉）或點一下。 */
function idle(){

  beep(level==='ok'?'ok':level==='warn'?'warn':level==='info'?'warn':'err');

/* 版面：狀態條下方到工具列上方＝鏡頭區；結果蓋在鏡頭區最上面 RES_FRAC。
   v7.5.1：掃描框改成置中在「整個鏡頭區」（不再縮在結果區下面那一小塊），
   因為報到卡片讓狀態條變高，原本的框會縮成一個小圈圈。框的位置＝實際讀取範圍（cropOf 同步）。 */
function layout(){
  var top = $('bar').offsetHeight, bot = $('tools').offsetHeight;
  var W = window.innerWidth, H = window.innerHeight - top - bot;
  if(H < 200) H = 200;
  var resH = Math.max(170, Math.round(H*RES_FRAC));
  var vh2 = H - resH;
  var side = Math.round(Math.min(W, H) * 0.62);   // v7.5.4：框縮小，整個框都在鏡頭區裡
  L = { T:top, H:H, W:W, resH:resH, vh2:vh2, side:side };
  var cw = $('camWrap');
  cw.style.top = top+'px'; cw.style.bottom = bot+'px';
  var bTop = Math.round(top + (H-side)/2);
  var wt = $('wait'); if(wt) wt.style.top = Math.max(top+2, bTop-30)+'px';   // 黃字放在框的正上方
  /* v7.5.4：結果小卡＝標題那一行到餐點卡上緣、右半邊（不蓋「示範用」橫條） */
  var r = $('res'), t0 = $('bigT').offsetTop, endEl = null;
  ['mCard','mWarn','b3'].some(function(id){ var e=$(id); if(e && !e.classList.contains('hide') && e.offsetHeight){ endEl=e; return true; } });
  var t1 = endEl ? endEl.offsetTop - 6 : t0 + 140;
  r.style.top = t0+'px'; r.style.height = Math.max(90, t1 - t0)+'px';
  var b = $('box');
  b.style.width = side+'px'; b.style.height = side+'px';
  b.style.left = Math.round((W-side)/2)+'px';
  b.style.top  = bTop+'px';
}
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', function(){ setTimeout(layout,300); });

/* ============================================================
   聲音與震動（A4）
   ============================================================ */
var AC=null;
function audioOn(){
  try{
    var A = window.AudioContext||window.webkitAudioContext; if(!A) return;
    AC = AC || new A();
    if(AC.state==='suspended' && AC.resume) AC.resume();
  }catch(e){}
}
function beep(kind){
  try{
    if(!AC) audioOn(); if(!AC) return;
    var q = kind==='ok'   ? [[880,0,.08],[1320,.09,.10]]
          : kind==='warn' ? [[540,0,.15],[540,.20,.15]]
          :                 [[220,0,.50]];
    q.forEach(function(s){
      var o=AC.createOscillator(), g=AC.createGain();
      o.connect(g); g.connect(AC.destination);
      o.type='sine'; o.frequency.value=s[0];
      var t=AC.currentTime+s[1];
      g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(.35,t+.012);
      g.gain.exponentialRampToValueAtTime(.0001,t+s[2]);
      o.start(t); o.stop(t+s[2]+.03);
    });
  }catch(e){}
}
function buzz(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }

   螢幕不要睡
   ============================================================ */
var WL=null;
function wake(){
  try{
    if(!navigator.wakeLock) return;
    navigator.wakeLock.request('screen').then(function(l){
      WL=l; l.addEventListener('release', function(){ WL=null; });
    }, function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){

/* ============================================================
   鏡頭（A3：指定主鏡頭、固定解析度、只掃框內）
   ============================================================ */
var CAM = { kind:'', track:null, stop:function(){}, torch:false, h5:null, timer:null, det:null };

function pickCamera(){
  /* 排掉超廣角／望遠／深度鏡頭，優先挑後置主鏡頭 */
  if(!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return Promise.resolve(null);
  return navigator.mediaDevices.enumerateDevices().then(function(ds){
    var cams = ds.filter(function(d){ return d.kind==='videoinput'; });
    if(cams.length<2) return null;
    var back = cams.filter(function(d){ return /back|rear|後|環境|environment/i.test(d.label||''); });
    var pool = back.length?back:cams;
    var good = pool.filter(function(d){
      return !/wide|廣角|ultra|超|tele|望遠|depth|深度|truedepth/i.test(d.label||'');
    });
    return (good[0]||pool[0]).deviceId;
  }, function(){ return null; });
}

function startCam(){
  layout();
  var hasDet = (typeof window.BarcodeDetector !== 'undefined');
  (hasDet ? BarcodeDetector.getSupportedFormats().then(function(f){ return f.indexOf('qr_code')>-1; }, function(){ return false; })
          : Promise.resolve(false))
  .then(function(useDet){
    return pickCamera().then(function(id){
      return useDet ? startNative(id) : startLib(id);
    });
  }).catch(function(e){ camErr(e); });
}

/* 掃描框在鏡頭畫面裡對應的位置（影片是 cover 填滿鏡頭區，所以要換算）
   v7.5.1：框置中在整個鏡頭區，所以 by＝(H－side)/2 */
function cropOf(vid){
  var vw=vid.videoWidth, vh=vid.videoHeight; if(!vw||!vh||!L.W) return null;
  var s  = Math.max(L.W/vw, L.H/vh);
  var ox = (vw*s - L.W)/2, oy = (vh*s - L.H)/2;
  var bx = (L.W - L.side)/2, by = (L.H - L.side)/2;
  var sx = Math.max(0, (bx+ox)/s), sy = Math.max(0, (by+oy)/s);
  var ss = Math.min(L.side/s, vw-sx, vh-sy);
  return { x:Math.round(sx), y:Math.round(sy), s:Math.max(40, Math.round(ss)) };
}

/* 路線 1：瀏覽器內建 QR 偵測（Android Chrome 最省電、最快） */
function startNative(devId){
  var v = { width:{ideal:1280}, height:{ideal:720}, frameRate:{ideal:24,max:30} };
  if(devId) v.deviceId = { exact:devId }; else v.facingMode = { ideal:'environment' };
  return navigator.mediaDevices.getUserMedia({ video:v, audio:false }).then(function(st){
    CAM.kind='native';
    CAM.track = st.getVideoTracks()[0];
    CAM.stop = function(){ if(CAM.timer) clearTimeout(CAM.timer); st.getTracks().forEach(function(t){ t.stop(); }); };
    var vid = $('vid');
    vid.srcObject = st; show(vid,true); show($('reader'),false);
    show($('box'),true);
    CAM.det = new BarcodeDetector({ formats:['qr_code'] });
    var cv = document.createElement('canvas'), cx = cv.getContext('2d', { willReadFrequently:true });
    function loop(){
      CAM.timer = setTimeout(loop, SCAN_MS);
      var c = cropOf(vid); if(!c) return;
      cv.width=c.s; cv.height=c.s;
      try{ cx.drawImage(vid, c.x, c.y, c.s, c.s, 0, 0, c.s, c.s); }
      catch(e){ return; }
      CAM.det.detect(cv).then(function(list){
        if(list && list.length) hit(list[0].rawValue);
      }, function(){});
    }
    vid.play().catch(function(){});
    loop();
    idle();
    dot(QUEUE.length?'busy':'ok', '鏡頭已開（內建辨識）');
  });
}

/* 路線 2：函式庫（iPhone 等沒有內建偵測的）
   v7.1：解析度降到 640×480、掃描框縮小、每秒 15 次（仍比 Android 慢） */
function startLib(devId){
  if(window.__LIBFAIL || typeof Html5Qrcode==='undefined')
    throw new Error('辨識函式庫沒有載入：請確認 html5-qrcode.min.js 和這一頁放在同一個資料夾');
  layout();
  show($('vid'),false); show($('reader'),true);
  show($('box'),false);
  var h = new Html5Qrcode('reader', {
    verbose:false,
    useBarCodeDetectorIfSupported:true,
    formatsToSupport: (window.Html5QrcodeSupportedFormats? [Html5QrcodeSupportedFormats.QR_CODE] : undefined)
  });
  CAM.kind='lib'; CAM.h5=h;
  CAM.stop = function(){ try{ h.stop(); }catch(e){} };
  var src = devId ? { deviceId:{ exact:devId } } : { facingMode:'environment' };
  /* 函式庫的掃描框固定在鏡頭區正中央（v7.5.1：大小跟置中的方框一致） */
  var side = Math.max(120, L.side);
  return h.start(src, { fps:LIB_FPS, qrbox:{ width:side, height:side }, disableFlip:true,
                        videoConstraints: Object.assign({ width:{ideal:LIB_RES[0]}, height:{ideal:LIB_RES[1]} }, src) },
    function(t){ hit(t); }, function(){})
    .then(function(){ idle(); dot(QUEUE.length?'busy':'ok','鏡頭已開（函式庫辨識）'); });
}

function camErr(e){
  var m = String((e&&(e.name+'：'+e.message))||e);
  var tip = /NotAllowedError|Permission/i.test(m)
    ? '請用 <b>Chrome</b>（Android）或 <b>Safari</b>（iPhone）直接開這一頁，不要從 LINE 或其他 App 內建瀏覽器開。<br>若出現「這個網站無法要求你授予權限」，請先關掉<b>浮在畫面上的 App</b>（濾藍光、錄影、小白點、泡泡），再重新整理。'
    : /NotFoundError|NotReadableError/i.test(m)
    ? '相機被別的 App 占用，或找不到相機。請關掉其他相機 App，再重新整理。'
    : '請重新整理這一頁再試一次。';
  overlay('📷 鏡頭打不開', '<div class="row" style="display:block">'+tip+'</div>'+
    '<div class="row" style="display:block;font-size:15px;color:#444">'+esc(m)+'</div>'+
    '<div class="row" style="display:block">還是不行就先用<b>手動輸入</b>（下方 ⌨️），或改用<b>備援掃描頁</b>（⋯ 其他）。這兩個都能正常記錄。</div>');
  dot('bad','鏡頭沒開');
}

$('lgKey').addEventListener('keydown', function(e){ if(e.key==='Enter') $('lgGo').click(); });

(function boot(){
  qLoad();
  DID = LS('did') || ('d'+Math.random().toString(36).slice(2,7));
  LS('did', DID);
  EP = EXEC_URL || LS('ep') || '';
  KEY = LS('key') || '';
  DEV = LS('dev') || '手機 A';
  if(!EP){ show($('setup'),true); return; }
  try{ $('lgDev').value = DEV; }catch(e){}
  if(KEY && rosterLoad()){
    if(!LS('exp')) LS('exp', String(Date.now()+LOGIN_H*3600000));   // 舊版留下的登入：從現在起算
    /* 憑證已過期、也沒有待送的紀錄 → 直接要求重新登入，不要先開工 */
    if(expired() && !QUEUE.length){ logout(true, '登入已超過 '+LOGIN_H+' 小時，為了安全請重新登入'); return; }
    /* 已經登入過：先用手機裡的名單直接開工，背景再更新 */
    go();
    download(function(err){ if(err) toast('名單還是舊的（'+err+'），先照常掃，連上線會自動更新'); else paintBar(); });
  } else {
    show($('login'),true);
    var nt = LS('notice');
    if(nt){ txt($('lgErr'), nt); LS('notice',null); }
  }
})();
</script>
</body>
</html>
